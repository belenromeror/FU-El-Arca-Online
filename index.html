let cache={},versions={},opened={},busy=false;window.cloudCache={getItem:k=>cache[k]??null,setItem:(k,v)=>{cache[k]=v}};window.privateStudents=[];const key='arca-fu-tl-drafts-v4';function msg(t){$('msg').hidden=!t;$('msg').textContent=t}function authorized(){if(!auth.currentUser||!names[auth.currentUser.uid])throw Error('Acceso no autorizado');return auth.currentUser}
